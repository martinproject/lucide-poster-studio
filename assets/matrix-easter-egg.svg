<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%">
  <defs>
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020804" />
      <stop offset="50%" stop-color="#001407" />
      <stop offset="100%" stop-color="#000502" />
    </linearGradient>
    <filter id="matrixGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00FF66" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="240" rx="16" fill="url(#matrixBg)" stroke="#00FF66" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- CRT Scanlines simulation -->
  <g stroke="#00FF66" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="20" x2="1100" y2="20" />
    <line x1="0" y1="40" x2="1100" y2="40" />
    <line x1="0" y1="60" x2="1100" y2="60" />
    <line x1="0" y1="80" x2="1100" y2="80" />
    <line x1="0" y1="100" x2="1100" y2="100" />
    <line x1="0" y1="120" x2="1100" y2="120" />
    <line x1="0" y1="140" x2="1100" y2="140" />
    <line x1="0" y1="160" x2="1100" y2="160" />
    <line x1="0" y1="180" x2="1100" y2="180" />
    <line x1="0" y1="200" x2="1100" y2="200" />
    <line x1="0" y1="220" x2="1100" y2="220" />
  </g>

  <!-- Left: Matrix Terminal Title -->
  <g transform="translate(48, 55)">
    <!-- Ping light -->
    <circle cx="6" cy="6" r="4" fill="#00FF66" filter="url(#matrixGlow)" />
    <text x="22" y="11" fill="#00FF66" font-family="monospace" font-size="13" font-weight="700" letter-spacing="2">SECRET CYBER EASTER EGG // 1999 IDENT</text>

    <text x="0" y="52" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">
      The Matrix Digital Rain Animation
    </text>

    <text x="0" y="85" fill="#86EFAC" font-family="monospace" font-size="13">
      &gt; 1,779 Vector Glyphs • Don Davis Synthesizer Soundtrack • CRT Shaders
    </text>

    <g transform="translate(0, 115)">
      <!-- Key Badge 1 -->
      <rect x="0" y="0" width="150" height="30" rx="6" fill="#052E16" stroke="#00FF66" stroke-width="1" />
      <text x="14" y="20" fill="#00FF66" font-family="monospace" font-size="12" font-weight="700">Cmd + Shift + M</text>

      <text x="165" y="20" fill="#6EE7B7" font-family="monospace" font-size="12">or type </text>

      <!-- Key Badge 2 -->
      <rect x="230" y="0" width="84" height="30" rx="6" fill="#052E16" stroke="#00FF66" stroke-width="1" />
      <text x="242" y="20" fill="#00FF66" font-family="monospace" font-size="12" font-weight="700">matrix</text>
    </g>
  </g>

  <!-- Right: Digital Rain Stream Graphic -->
  <g transform="translate(780, 25)" font-family="monospace" font-size="15" font-weight="bold">
    <!-- Col 1 -->
    <text x="0" y="30" fill="#FFFFFF" filter="url(#matrixGlow)">[T]</text>
    <text x="0" y="55" fill="#4ADE80">[C]</text>
    <text x="0" y="80" fill="#22C55E">[#]</text>
    <text x="0" y="105" fill="#15803D">[&lt;&gt;]</text>
    <text x="0" y="130" fill="#166534">[0]</text>
    <text x="0" y="155" fill="#14532D">[1]</text>
    <text x="0" y="180" fill="#052E16">[*]</text>

    <!-- Col 2 -->
    <text x="60" y="70" fill="#FFFFFF" filter="url(#matrixGlow)">[⚡]</text>
    <text x="60" y="95" fill="#4ADE80">[⎋]</text>
    <text x="60" y="120" fill="#22C55E">[⌕]</text>
    <text x="60" y="145" fill="#15803D">[⌘]</text>
    <text x="60" y="170" fill="#166534">[∞]</text>
    <text x="60" y="195" fill="#052E16">[#]</text>

    <!-- Col 3 -->
    <text x="120" y="45" fill="#FFFFFF" filter="url(#matrixGlow)">[Ω]</text>
    <text x="120" y="70" fill="#4ADE80">[⏣]</text>
    <text x="120" y="95" fill="#22C55E">[⚛]</text>
    <text x="120" y="120" fill="#15803D">[✦]</text>
    <text x="120" y="145" fill="#166534">[⌨]</text>
    <text x="120" y="170" fill="#052E16">[⚿]</text>

    <!-- Col 4 -->
    <text x="180" y="90" fill="#FFFFFF" filter="url(#matrixGlow)">[&lt;/&gt;]</text>
    <text x="180" y="115" fill="#4ADE80">[⌁]</text>
    <text x="180" y="140" fill="#22C55E">[⎈]</text>
    <text x="180" y="165" fill="#15803D">[⌗]</text>
    <text x="180" y="190" fill="#052E16">[⍜]</text>
  </g>
</svg>
