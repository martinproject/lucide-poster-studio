<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="100%">
  <defs>
    <!-- Editorial Light Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAF8F5" />
    </linearGradient>

    <!-- Refined Editorial Palette Accents -->
    <linearGradient id="coralAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE5D53" />
      <stop offset="100%" stop-color="#C53030" />
    </linearGradient>
    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1A1815" flood-opacity="0.06" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A1815" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Card 1: 1,779 Vector Glyphs & Inspector -->
  <g transform="translate(20, 20)" filter="url(#cardShadow)">
    <rect width="245" height="280" rx="16" fill="url(#cardGrad)" stroke="#E7E2DA" stroke-width="1.2" />
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#DE5D53" fill-opacity="0.1" stroke="#DE5D53" stroke-width="1.2" />
    <!-- Grid icon -->
    <path d="M38 38 h6 v6 h-6 z M48 38 h6 v6 h-6 z M38 48 h6 v6 h-6 z M48 48 h6 v6 h-6 z" fill="#DE5D53" />
    
    <text x="24" y="102" fill="#1A1815" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">1,779 Icon Grid</text>
    <text x="24" y="126" fill="#66625D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
      <tspan x="24" dy="0">Complete Lucide official</tspan>
      <tspan x="24" dy="18">catalog with instant single-cell</tspan>
      <tspan x="24" dy="18">inspector &amp; lock mechanism.</tspan>
    </text>
    
    <!-- Code pill -->
    <rect x="24" y="220" width="197" height="28" rx="6" fill="#F4EFEA" stroke="#E7E0D6" stroke-width="1" />
    <text x="36" y="238" fill="#0284C7" font-family="monospace" font-size="11" font-weight="600">lucide.woff2 • 0ms Lag</text>
  </g>

  <!-- Card 2: Editorial Presets & Layouts -->
  <g transform="translate(290, 20)" filter="url(#cardShadow)">
    <rect width="245" height="280" rx="16" fill="url(#cardGrad)" stroke="#E7E2DA" stroke-width="1.2" />
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1.2" />
    <!-- Preset layout icon -->
    <rect x="36" y="36" width="20" height="20" rx="3" fill="none" stroke="#10B981" stroke-width="2" />
    <line x1="36" y1="42" x2="56" y2="42" stroke="#10B981" stroke-width="2" />
    
    <text x="24" y="102" fill="#1A1815" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Editorial Presets</text>
    <text x="24" y="126" fill="#66625D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
      <tspan x="24" dy="0">Curated Swiss, Bauhaus,</tspan>
      <tspan x="24" dy="18">Cyberpunk, Dark &amp; Minimal</tspan>
      <tspan x="24" dy="18">presets with custom ratios.</tspan>
    </text>

    <!-- Code pill -->
    <rect x="24" y="220" width="197" height="28" rx="6" fill="#F4EFEA" stroke="#E7E0D6" stroke-width="1" />
    <text x="36" y="238" fill="#059669" font-family="monospace" font-size="11" font-weight="600">A2, A3, A4, 16:9, 1:1</text>
  </g>

  <!-- Card 3: 3D Gallery Mockups -->
  <g transform="translate(560, 20)" filter="url(#cardShadow)">
    <rect width="245" height="280" rx="16" fill="url(#cardGrad)" stroke="#E7E2DA" stroke-width="1.2" />
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#F59E0B" fill-opacity="0.1" stroke="#F59E0B" stroke-width="1.2" />
    <!-- 3D frame icon -->
    <path d="M46 36 L56 42 L46 48 L36 42 Z M36 44 L36 54 L46 60 L46 50 Z M56 44 L56 54 L46 60 L46 50 Z" fill="none" stroke="#D97706" stroke-width="1.6" />

    <text x="24" y="102" fill="#1A1815" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">3D Spatial Mockup</text>
    <text x="24" y="126" fill="#66625D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
      <tspan x="24" dy="0">Real-world gallery preview</tspan>
      <tspan x="24" dy="18">with wood, aluminum &amp;</tspan>
      <tspan x="24" dy="18">minimalist glass frames.</tspan>
    </text>

    <!-- Code pill -->
    <rect x="24" y="220" width="197" height="28" rx="6" fill="#F4EFEA" stroke="#E7E0D6" stroke-width="1" />
    <text x="36" y="238" fill="#B45309" font-family="monospace" font-size="11" font-weight="600">Interior Lighting &amp; Mats</text>
  </g>

  <!-- Card 4: Vector Export & Named Layers -->
  <g transform="translate(830, 20)" filter="url(#cardShadow)">
    <rect width="245" height="280" rx="16" fill="url(#cardGrad)" stroke="#E7E2DA" stroke-width="1.2" />
    <rect x="24" y="24" width="44" height="44" rx="10" fill="#0284C7" fill-opacity="0.1" stroke="#0284C7" stroke-width="1.2" />
    <!-- Vector export download icon -->
    <path d="M46 34 L46 48 M40 43 L46 49 L52 43 M36 53 L56 53" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <text x="24" y="102" fill="#1A1815" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">Named Vector SVG</text>
    <text x="24" y="126" fill="#66625D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400">
      <tspan x="24" dy="0">Layer names preserved for</tspan>
      <tspan x="24" dy="18">Figma &amp; Illustrator,</tspan>
      <tspan x="24" dy="18">plus 300 DPI PDF &amp; 4K PNG.</tspan>
    </text>

    <!-- Code pill -->
    <rect x="24" y="220" width="197" height="28" rx="6" fill="#F4EFEA" stroke="#E7E0D6" stroke-width="1" />
    <text x="36" y="238" fill="#0284C7" font-family="monospace" font-size="11" font-weight="600">SVG Layers • PDF • PNG</text>
  </g>
</svg>
